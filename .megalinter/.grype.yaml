  # @link https://nvd.nist.gov/vuln/detail/CVE-2018-20225
  - vulnerability: CVE-2018-20225
    reason: >-
      Ignored by default in the MegaLinter v9.6.0 template; disputed and
      unwarranted CVE.
  # jscpd:ignore-start
