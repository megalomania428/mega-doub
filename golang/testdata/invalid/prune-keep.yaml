---
# Elements of prune.keep out of the format n:m, out of the range of int or with an age
# below 1, one problem per element.
storage:
  url: 'b2://keep-bucket/mega-doub'
  snapshot_id: keep-main
  password: 'env:MEGA_DOUB_KEEP_STORAGE_PASSWORD'
prune:
  threads: 0
  keep:
    - '0:0'
    - '1:0'
    - ' 1:7'
    - '99999999999999999999:5'
    - '7'
