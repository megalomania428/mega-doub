---
# Syntax of the secret references; vault.token is reported once, by the vault rules.
vault:
  token: 'vault:x'
storage:
  url: 'b2://secrets-bucket/mega-doub'
  snapshot_id: secrets-main
  password: 'env:MEGA_DOUB_SECRETS_STORAGE_PASSWORD'
  keys:
    b2_id: 'file:relative/b2-id'
    b2_key: 'env:B2-KEY'
targets:
  - name: syntax
    transport: ssh
    host: syntax.example.invalid
    user: backup
    auth: ['key']
    key: 'env:1KEY'
    key_passphrase: 'env:'
    known_hosts: /etc/ssh/syntax_known_hosts
    sources: [{type: test, id: syntax, path: /srv/syntax, token: 'file:/x/../y'}]
