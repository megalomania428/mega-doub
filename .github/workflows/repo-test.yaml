# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# cspell:ignore mktemp coverprofile covermode
---
name: repo test
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "11 11 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  tests:
    name: tests
    timeout-minutes: 33
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
  linters:
    name: linters
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: lint the repo
        env:
          BRA: master
          USE_LINTIGNORE: 1
        run: |
          curl -fsL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/sources/linters-ubuntu-22_04/check-dir.sh | bash
          curl -fsL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/_shared/install/ansible/check-dir.sh | bash
  MegaLinter:
    name: MegaLinter
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Run MegaLinter
        uses: megalomania428/github-actions/megalinter@master
  all-green:
    name: all green
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs:
      - tests
      - linters
      - MegaLinter
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
