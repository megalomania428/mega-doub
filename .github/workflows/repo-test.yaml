# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# cspell:ignore mktemp coverprofile covermode gofmt testdata
---
name: repo test
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "11 11 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  tests:
    name: tests
    timeout-minutes: 33
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: golang/go.mod
          cache: true
          cache-dependency-path: golang/go.sum
      - name: go checks
        working-directory: golang
        run: |
          go mod verify
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'unformatted files:\n%s\n' "${unformatted}"
            exit 1
          fi
          go build ./...
          go vet ./...
          go test -race ./...
      - name: smoke
        working-directory: golang
        run: |
          dir="${RUNNER_TEMP:-/tmp}/mega-doub-smoke"
          mkdir -p "${dir}"
          go build -o "${dir}/mega-doub" ./cmd/mega-doub
          expect() {
            local want="$1" got=0
            shift
            "${dir}/mega-doub" "$@" >/dev/null 2>&1 || got=$?
            if [[ "${got}" -ne "${want}" ]]; then
              printf 'mega-doub %s: exit code %s, want %s\n' "$*" "${got}" "${want}"
              exit 1
            fi
          }
          expect 0 --help
          expect 0 version
          expect 0 --version
          expect 2 bogus
          expect 2 backup --bogus
          expect 0 config validate -c testdata/example.yaml
          expect 2 config validate -c testdata/invalid/unknown-key-root.yaml
          expect 3 backup -c testdata/example.yaml
  linters:
    name: linters
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: lint the repo
        env:
          BRA: master
          USE_LINTIGNORE: 1
        run: |
          curl -fsL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/sources/linters-ubuntu-22_04/check-dir.sh | bash
          curl -fsL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/_shared/install/ansible/check-dir.sh | bash
  MegaLinter:
    name: MegaLinter
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Run MegaLinter
        uses: megalomania428/github-actions/megalinter@master
  all-green:
    name: all green
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs:
      - tests
      - linters
      - MegaLinter
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
